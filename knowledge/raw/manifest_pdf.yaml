# PDF ingestion manifest — PDF Agent / DB Agent
version: "1.1"
format: pdf
updated: "2026-06-14"
index: INDEX_PDF.md
total_documents: 33
parsed_documents: 33
ingestable: 33
pending_ocr: 0

# MinerU 解析 → 解压 → ingest 流水线
parse_pipeline:
  raw_dir: knowledge/raw
  parsed_dir: knowledge/parsed
  extract_manifest: knowledge/parsed/extract_manifest.json
  clean_rules: knowledge/raw/clean_rules.yaml
  mineru_max_pages: 200
  scripts:
    extract: app/retrieval/mineru.py
    unzip: scripts/unzip_parsed.py
    clean: app/retrieval/clean_rules.py
    ingest: app/retrieval/ingest_pdf.py  # 待实现

layout:
  macro_research: macro_research/
  industry_whitepapers: industry_whitepapers/
  annual_reports: annual_reports/
  research_reports: research_reports/
  policy: policy/

agents:
  pdf_agent:
    categories: [macro_research, annual_reports, research_reports, industry_whitepapers, policy]
  db_agent:
    categories: [annual_reports]
    note: structured financial metrics extracted to SQL, not vector store

metadata_schema:
  # 文档级：在 manifest documents 中维护
  required:
    - format          # 固定 "pdf"
    - doc_id          # 全局唯一编号
    - title           # 文档标题
    - category        # macro_research | annual_reports | research_reports | industry_whitepapers | policy
    - file            # 原始 PDF 相对路径
    - parse_status    # ok | ocr_required | pending
    - extract_status  # pending | done | failed
    - ingest          # 是否写入向量库
    - authority_tier  # official | broker | vendor
    - chunk_strategy  # section | table_aware
  optional:
    - ticker          # 股票代码（年报）
    - fiscal_year     # 报告年度（年报）
    - effective_date  # 发布/生效日期
    - issuer          # 发布机构（研报）
    - language        # zh-CN | zh-TW
    - doc_group       # 逻辑文档组（拆页后合并用，默认等于 PDF 文件名 stem）
    - total_pages     # 原始 PDF 总页数
    - parsed_path     # 解压后 full.md 目录（单文件）
    - parts           # 拆页分段列表（年报等多段文档）
  # 切片级：ingest 脚本自动生成，写入每个 chunk
  chunk_runtime:
    - section_path    # 章节路径，如 "管理层讨论与分析 > 风险因素"
    - page_range      # 页码范围，如 "001-200"
    - part_index      # 分段序号，从 1 开始
    - chunk_index     # 文档内 chunk 序号
    - source          # 来源目录/文件名

matching_rules:
  parsed_root: knowledge/parsed
  # 拆页目录名：{doc_group}_p{start:03d}-{end:03d} → 匹配 file: {category}/{doc_group}.pdf
  split_pattern: "_p(?P<start>\\d{3})-(?P<end>\\d{3})$"
  embed_metadata_in_chunk: true

