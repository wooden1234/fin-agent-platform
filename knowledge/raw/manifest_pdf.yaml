ingestion_rules:
  include_globs:
    - macro_research/*.pdf
    - annual_reports/*.pdf
    - research_reports/*.pdf
    - industry_whitepapers/*.pdf
    - policy/*.pdf
  parsed_globs:
    - knowledge/parsed/macro_research/*/full.md
    - knowledge/parsed/annual_reports/*/full.md
    - knowledge/parsed/research_reports/*/full.md
    - knowledge/parsed/industry_whitepapers/*/full.md
    - knowledge/parsed/policy/*/full.md
  exclude_globs:
    - knowledge/parsed/_splits/**
  embed_metadata_in_chunk: true
  default_metadata:
    format: pdf

